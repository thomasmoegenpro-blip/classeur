<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classeur — Fiches de révision</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ÉCRAN CONNEXION / INSCRIPTION -->
<div id="view-auth" class="view">
  <div class="auth-box">
    <h1 class="logo">Classeur</h1>
    <p class="tagline">Les fiches de révision de ta classe, générées automatiquement.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Se connecter</button>
      <button class="auth-tab" data-tab="signup">Créer un compte</button>
    </div>

    <form id="form-login" class="auth-form">
      <label>Email</label>
      <input type="email" id="login-email" required autocomplete="email">
      <label>Mot de passe</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <p class="form-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <form id="form-signup" class="auth-form" hidden>
      <label>Prénom (visible par ta classe)</label>
      <input type="text" id="signup-pseudo" required>
      <label>Code d'invitation de ta classe</label>
      <input type="text" id="signup-code" required placeholder="Donné par un délégué ou un prof">
      <label>Email</label>
      <input type="email" id="signup-email" required autocomplete="email">
      <label>Mot de passe</label>
      <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
      <p class="form-error" id="signup-error"></p>
      <button type="submit" class="btn btn-primary">Créer mon compte</button>
    </form>
  </div>
</div>

<!-- APPLICATION PRINCIPALE -->
<div id="view-app" class="view" hidden>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <h1 class="logo">Classeur</h1>
        <p class="user-tag">Salut, <span id="user-pseudo"></span></p>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">Classe consultée</label>
        <select id="classe-select"></select>
      </div>

      <nav id="matiere-tabs" class="matiere-tabs"></nav>

      <button id="btn-logout" class="btn btn-ghost sidebar-bottom">Se déconnecter</button>
    </aside>

    <main class="main">
      <div class="main-header">
        <h2 id="matiere-title"></h2>
        <button id="btn-upload" class="btn btn-primary">+ Importer un cours</button>
      </div>
      <div id="fiches-grid" class="fiches-grid"></div>
    </main>
  </div>

  <button id="chat-toggle" class="chat-toggle" title="Chat de ma classe">💬</button>
  <div id="chat-root"></div>
  <div id="modal-root"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
